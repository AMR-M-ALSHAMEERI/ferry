[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ferry-cli"
version = "0.1.0"
description = "Back up, restore and move your AI coding assistant conversations across Claude Code, OpenAI Codex, GitHub Copilot Chat and Google Antigravity."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ferry contributors" }]
keywords = [
    "claude-code",
    "codex",
    "copilot",
    "antigravity",
    "backup",
    "migration",
    "conversations",
    "cli",
]
# Read by the PyPI page and by the Python-versions badge in the README. No
# licence classifier: `license` above is an SPDX expression, and the packaging
# standard forbids stating it twice.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.12",
    # Ferry's own prompts, themed, arrow-driven. Declared directly because
    # three modules import it directly. It arrived transitively under
    # questionary, and dropping questionary without declaring this broke all
    # twelve CI legs while the local venv carried on passing: an undeclared
    # dependency is invisible until the environment that never had it.
    #
    # No questionary. It was declared at M0 for the prompts and superseded at
    # M2 by these screens, which the themes require: a questionary prompt takes
    # a pointer and a marker but no colours, so it renders black and white in
    # the middle of a themed run. Its last caller went at M7b.2 (#199).
    "prompt_toolkit>=3.0",
    "pydantic>=2",
    "rich>=13",
    "httpx>=0.27",
    "pyperclip>=1.9",
    # Bundle encryption (M7). AES-256-GCM and scrypt both come from here, so
    # Ferry implements no cryptography of its own beyond framing.
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/AMR-M-ALSHAMEERI/ferry"
Documentation = "https://github.com/AMR-M-ALSHAMEERI/ferry/blob/main/docs/GUIDE.md"
Issues = "https://github.com/AMR-M-ALSHAMEERI/ferry/issues"
Changelog = "https://github.com/AMR-M-ALSHAMEERI/ferry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    # ruff and mypy are exact-pinned, and the same versions are pinned in
    # .pre-commit-config.yaml. Both are pass/fail gates, so an unpinned one is
    # a gate that changes its mind: a floating CI ruff once rejected formatting
    # that the older pre-commit ruff had just applied, failing all 12 legs on a
    # commit that was green locally. Bump all pins together, never one alone.
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pre-commit",
]

[project.scripts]
ferry = "ferry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ferry"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["spikes", ".private"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ferry.core.*", "ferry.ucs.*"]
strict = true

[[tool.mypy.overrides]]
module = ["ferry.adapters.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
# The repository root, so `from tests.<helper> import ...` resolves.
#
# `python -m pytest` puts the working directory on sys.path and the `pytest`
# console script does not. Every local run used the first and CI runs the
# second, so shared test helpers imported as `tests.x` worked here and failed
# there -- across two pushes, while the local suite reported green. This makes
# the two invocations mean the same thing.
pythonpath = ["."]

[tool.coverage.run]
source = ["src/ferry"]
