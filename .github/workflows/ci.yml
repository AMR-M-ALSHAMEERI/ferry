name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.11 is the declared floor (pyproject requires-python).
        # 3.14 is the primary local dev interpreter — kept here so the version
        # actually developed on is covered by CI.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (editable, dev extras)
        run: pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/

      - name: Test (pytest)
        run: pytest -v

      # core/ and ucs/ have a hard 90% floor. Enforced separately
      # from the adapters (80% floor) because coverage thresholds are global per run.
      - name: Coverage floor — core + ucs (90%)
        run: pytest --cov=ferry.core --cov=ferry.ucs --cov-fail-under=90 -q
